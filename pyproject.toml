[project]
name = "release-puller"
version = "0.0.3"
requires-python = ">=3.12"
dependencies = ["pyfangs"]

[tool.uv.sources]
pyfangs = { git = "ssh://git@github.com/leandrorojas/pyfangs", rev = "v0.7.2" }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
